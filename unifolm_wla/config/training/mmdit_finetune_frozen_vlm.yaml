run_id: finetune_wla_base_frozen_vlm
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: unifolm_wla_finetune
is_debug: false

framework:
  name: QwenMMDiT
  qwenvl:
    # Overridden at launch to <base_model_dir>/tokenizer — the released
    # checkpoint's own VLM weights are already in `trainer.pretrained_checkpoint`
    # below, so `base_vlm` only needs to supply the architecture config +
    # tokenizer (see `_is_weightless_base_vlm` in unifolm_wla/model/modules/vlm/QWen3.py).
    base_vlm: /path/to/UnifoLM-WLA-1.0-Base/tokenizer
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  robot_state_projector:
    enabled: true
    input_dim: 120
    projector_hidden_size: null
    load_from: null
  action_model:
    action_model_type: DiT-L
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 54
    state_dim: 0
    action_horizon: 30
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    embodiment_types: ["unitree"]
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: multi_source_datasets
    # Overridden at launch to the --data_config_path passed to
    # run_finetune_mmdit_frozen_vlm.sh (default: unitree.yaml).
    data_config_path: unifolm_wla/dataloader/multi_source_dataset/configs/unitree.yaml
    per_device_batch_size: 1
    num_workers: 2

trainer:
  # Overridden at launch to <base_model_dir>/checkpoints/model.safetensors.
  pretrained_checkpoint: /path/to/UnifoLM-WLA-1.0-Base/checkpoints/model.safetensors
  is_resume: false
  # Freeze the VLM backbone -- only the action-expert (DiT) head and the
  # robot-state projector train. Fits a single 24GB GPU; drop this to
  # co-train the VLM if you have more VRAM.
  #
  # NOTE: `robot_state_projector` is attached *inside* `qwen_vl_interface`
  # (`qwen_vl_interface.model.robot_state_projector`, see QWen3.py
  # `attach_robot_state_projector`), so freezing `qwen_vl_interface` alone would
  # freeze the projector too. `unfreeze_modules` below carves it back out so it
  # actually trains, which is the behaviour documented in
  # docs/train_action_expert.md.
  freeze_modules: "qwen_vl_interface"
  unfreeze_modules: "qwen_vl_interface.model.robot_state_projector"
  max_train_steps: 20000
  num_warmup_steps: 200
  save_interval: 2000
  eval_interval: 2000
  logging_frequency: 10
  gradient_accumulation_steps: 8
  gradient_clipping: 1.0
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: safetensors
