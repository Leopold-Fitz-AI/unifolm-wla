base_config: vla_balanced.yaml
grasp_hold_position_tolerance_m: 0.01
grasp_hold_tool_offsets: [[0.15, 0, 0, 0, 0, 0], [0.15, 0, 0, 0, 0, 0]]
grasp_hold:
  enabled: true
  sensor_endpoint: tcp://127.0.0.1:15558
  min_jaw_force_n: 0.05
  contact_seconds: 0.08
  hand_lift_m: 0.10
  hold_sim_seconds: 6.0
  loss_grace_seconds: 0.2
ready_gate:
  enabled: true
  stable_sim_seconds: 0.5
  timeout_seconds: 45
  waist_tolerance_rad: 0.2
  base_tolerance_m: 0.08
grasp_hold_force:
  target_n: 4.0
  gain: 3.0
  max_rate: 3.0
  max_correction: 2.5
